[package]
name = "qf"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Code search TUI with a live preview. Enter opens the hit in your editor at the line."
repository = "https://github.com/betterslop/qf"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rayon = "1.12.0"
regex-syntax = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
syntect = "5.3.0"
bs-tui-common = { version = "0.1.0", git = "https://github.com/betterslop/bs-tui-common" }
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
syntect = "5.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
